name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: bash ./mvnw test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify generated API client
        working-directory: frontend
        run: npm run api:check
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend Playwright E2E
        working-directory: frontend
        run: npm run e2e

  migration:
    name: Clean and forward PostgreSQL migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Flyway migrations using PostgreSQL Testcontainers
        working-directory: backend
        run: bash ./mvnw -Dtest=PostgresMigrationIT,Slice3MigrationIT,Slice4MigrationIT,Slice5MigrationIT,Slice6MigrationIT,Slice7MigrationIT,SettlementApplicationServiceIT,PayoutApplicationServiceIT test

  devops:
    name: Container and optional GCP reference validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --file backend/Dockerfile backend
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate optional GCP staging foundation
        working-directory: infra/terraform/bootstrap/staging-foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate optional GCP staging runtime
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate optional Firebase Hosting configuration
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"

  zero-cost-production-like:
    name: Zero-cost production-like smoke
    needs: [backend, frontend, migration, devops]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend bundles
        working-directory: frontend
        env:
          VITE_LIFF_ID: zero-cost-prototype-liff
          VITE_API_BASE_URL: http://127.0.0.1:18080/api/v1
        run: |
          npm ci
          npm run api:check
          npm run build
          test -f apps/liff/dist/index.html
          test -f apps/admin/dist/index.html
      - name: Run ephemeral PostgreSQL + migration + API smoke
        run: bash scripts/zero-cost-production-like.sh
      - name: Upload zero-cost release candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-release-${{ github.sha }}
          path: zero-cost-release-metadata.json
          if-no-files-found: error

  slice7-contract-sync:
    name: Temporary Slice 7 contract sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch canonical Settlement/Payout contract
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new))

          openapi = Path('backend/src/main/resources/openapi/openapi.yaml')
          openapi_text = openapi.read_text()
          if '/course-sessions/{sessionId}/settlement:' not in openapi_text:
              store = Path('backend/src/main/java/com/pickleball/booking/settlement/infrastructure/SettlementStore.java')
              replace_exact(store,
                  'select id, coach_profile_id, payable_amount, paid_amount, payout_status\n                from coach_settlements',
                  'select id, coach_profile_id, payable_amount, paid_amount, payout_status, version\n                from coach_settlements')
              replace_exact(store,
                  'rs.getBigDecimal("paid_amount"),\n                rs.getString("payout_status")), settlementId);',
                  'rs.getBigDecimal("paid_amount"),\n                rs.getString("payout_status"),\n                rs.getLong("version")), settlementId);')
              replace_exact(store,
                  'select cs.id, cs.coach_profile_id, cs.payable_amount, cs.paid_amount, cs.payout_status\n                from coach_settlements cs',
                  'select cs.id, cs.coach_profile_id, cs.payable_amount, cs.paid_amount, cs.payout_status, cs.version\n                from coach_settlements cs')
              replace_exact(store,
                  'rs.getBigDecimal("paid_amount"),\n                rs.getString("payout_status")), settlementId, userId);',
                  'rs.getBigDecimal("paid_amount"),\n                rs.getString("payout_status"),\n                rs.getLong("version")), settlementId, userId);')
              replace_exact(store,
                  'BigDecimal paidAmount,\n            String payoutStatus) {}',
                  'BigDecimal paidAmount,\n            String payoutStatus,\n            long version) {}')

              service = Path('backend/src/main/java/com/pickleball/booking/settlement/application/SettlementApplicationService.java')
              replace_exact(service,
                  'row.id(), row.coachProfileId(), row.payableAmount(), row.paidAmount(), row.payoutStatus())).toList(),',
                  'row.id(), row.coachProfileId(), row.payableAmount(), row.paidAmount(), row.payoutStatus(), row.version())).toList(),')
              replace_exact(service,
                  'BigDecimal paidAmount,\n            String payoutStatus) {}',
                  'BigDecimal paidAmount,\n            String payoutStatus,\n            long version) {}')

              controller = Path('backend/src/main/java/com/pickleball/booking/settlement/api/SettlementController.java')
              replace_exact(controller,
                  'amount(row.paidAmount()),\n                        row.payoutStatus())).toList(),',
                  'amount(row.paidAmount()),\n                        row.payoutStatus(),\n                        row.version())).toList(),')
              replace_exact(controller,
                  'String paidAmount,\n            String payoutStatus) {}',
                  'String paidAmount,\n            String payoutStatus,\n            long version) {}')

              openapi_text = openapi_text.replace(
                  'description: P0 API contract through Slice 6 Finance.',
                  'description: P0 API contract through Slice 7 Settlement / Payout.')

              path_snippet = r'''

  /course-sessions/{sessionId}/settlement:
    get:
      operationId: getCourseSessionSettlement
      tags: [Settlement]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Session settlement detail; coaches receive only their own allocation projection, content: { application/json: { schema: { $ref: '#/components/schemas/SessionSettlementEnvelope' } } } }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /course-sessions/{sessionId}/settlement-calculation:
    post:
      operationId: calculateCourseSessionSettlement
      tags: [Settlement]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCalculationRequest' } } }
      responses:
        '200': { description: Settlement calculated from immutable session price and finance facts, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementCalculationEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /session-settlements/{settlementId}/confirmation:
    post:
      operationId: confirmSessionSettlement
      tags: [Settlement]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementConfirmationRequest' } } }
      responses:
        '200': { description: Settlement confirmed idempotently; payout readiness remains a CoachSettlement concern, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementConfirmationEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/coach-settlements:
    get:
      operationId: listMyCoachSettlements
      tags: [Settlement]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current coach payout-facing settlement read model, content: { application/json: { schema: { $ref: '#/components/schemas/CoachSettlementSelfListEnvelope' } } } }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payout-batches:
    post:
      operationId: createPayoutBatch
      tags: [Payouts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayoutBatchCreateRequest' } } }
      responses:
        '201': { description: Draft manual payout batch, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutBatchCreateEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payout-batches/{batchId}:
    get:
      operationId: getPayoutBatch
      tags: [Payouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payout batch detail, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutBatchEnvelope' } } } }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payout-batches/{batchId}/execution:
    post:
      operationId: executePayoutBatch
      tags: [Payouts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayoutExecutionRequest' } } }
      responses:
        '200': { description: Manual payout batch executed idempotently, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutExecutionEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
'''

              schema_snippet = r'''

    SettlementMoneyAmount:
      type: string
      pattern: '^[0-9]{1,10}(?:\.[0-9]{1,2})?$'
      example: '1500.00'
    SettlementSignedMoneyAmount:
      type: string
      pattern: '^-?[0-9]{1,10}(?:\.[0-9]{1,2})?$'
      example: '0.00'
    SettlementAllocationValue:
      type: [string, 'null']
      pattern: '^[0-9]{1,10}(?:\.[0-9]{1,4})?$'
    SettlementStatus: { type: string, enum: [PENDING_CALCULATION, CALCULATED, PENDING_APPROVAL, CONFIRMED, VOIDED] }
    SettlementAllocationType: { type: string, enum: [EQUAL, PERCENTAGE, FIXED] }
    CoachPayoutStatus: { type: string, enum: [WAITING_RECEIPT, READY, IN_BATCH, PARTIALLY_PAID, PAID, ON_HOLD, CANCELLED] }

    SettlementCoachAllocationRequest:
      type: object
      additionalProperties: false
      required: [coachProfileId, allocationType]
      properties:
        coachProfileId: { type: string, format: uuid }
        allocationType: { $ref: '#/components/schemas/SettlementAllocationType' }
        allocationValue: { $ref: '#/components/schemas/SettlementAllocationValue' }

    SettlementCalculationRequest:
      type: object
      additionalProperties: false
      properties:
        otherAdjustment: { $ref: '#/components/schemas/SettlementSignedMoneyAmount' }
        coachAllocations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SettlementCoachAllocationRequest' }

    SettlementCalculationResponse:
      type: object
      required: [sessionSettlementId, grossReceivable, venueCost, otherAdjustment, distributableAmount, coachPayableTotal, status]
      properties:
        sessionSettlementId: { type: string, format: uuid }
        grossReceivable: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        venueCost: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        otherAdjustment: { $ref: '#/components/schemas/SettlementSignedMoneyAmount' }
        distributableAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        coachPayableTotal: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        status: { type: string, enum: [CALCULATED] }

    SettlementCalculationEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/SettlementCalculationResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    SettlementConfirmationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 5000 }

    SettlementConfirmationResponse:
      type: object
      required: [sessionSettlementId, status, confirmedAt]
      properties:
        sessionSettlementId: { type: string, format: uuid }
        status: { type: string, enum: [CONFIRMED] }
        confirmedAt: { type: string, format: date-time }

    SettlementConfirmationEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/SettlementConfirmationResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    CoachSettlementAllocationResponse:
      type: object
      required: [coachSettlementId, coachProfileId, payableAmount, paidAmount, payoutStatus, version]
      properties:
        coachSettlementId: { type: string, format: uuid }
        coachProfileId: { type: string, format: uuid }
        payableAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        paidAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        payoutStatus: { $ref: '#/components/schemas/CoachPayoutStatus' }
        version: { type: integer, format: int64, minimum: 0 }

    SessionSettlementResponse:
      type: object
      required: [sessionSettlementId, courseSessionId, status, grossReceivable, venueCost, otherAdjustment, distributableAmount, coachSettlements, version]
      properties:
        sessionSettlementId: { type: string, format: uuid }
        courseSessionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SettlementStatus' }
        grossReceivable: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        venueCost: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        otherAdjustment: { $ref: '#/components/schemas/SettlementSignedMoneyAmount' }
        distributableAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        coachSettlements: { type: array, items: { $ref: '#/components/schemas/CoachSettlementAllocationResponse' } }
        version: { type: integer, format: int64, minimum: 0 }

    SessionSettlementEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/SessionSettlementResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    CoachSettlementSelfItem:
      type: object
      required: [coachSettlementId, courseSessionId, payableAmount, paidAmount, outstandingAmount, payoutStatus]
      properties:
        coachSettlementId: { type: string, format: uuid }
        courseSessionId: { type: string, format: uuid }
        payableAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        paidAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        outstandingAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        payoutStatus: { $ref: '#/components/schemas/CoachPayoutStatus' }

    CoachSettlementSelfList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CoachSettlementSelfItem' } }

    CoachSettlementSelfListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CoachSettlementSelfList' }
        meta: { $ref: '#/components/schemas/Meta' }

    PayoutMethod: { type: string, enum: [CASH, BANK_TRANSFER, OTHER], default: CASH }
    PayoutBatchStatus: { type: string, enum: [DRAFT, APPROVED, PROCESSING, COMPLETED, CANCELLED] }
    PayoutBatchItemStatus: { type: string, enum: [PLANNED, PAID, FAILED, CANCELLED] }

    PayoutBatchCreateItemRequest:
      type: object
      additionalProperties: false
      required: [coachSettlementId, amount]
      properties:
        coachSettlementId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/SettlementMoneyAmount' }

    PayoutBatchCreateRequest:
      type: object
      additionalProperties: false
      required: [payoutDate, items]
      properties:
        method: { $ref: '#/components/schemas/PayoutMethod' }
        payoutDate: { type: string, format: date }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/PayoutBatchCreateItemRequest' }

    PayoutBatchCreateResponse:
      type: object
      required: [payoutBatchId, batchNo, status, method, totalAmount, itemCount]
      properties:
        payoutBatchId: { type: string, format: uuid }
        batchNo: { type: string }
        status: { type: string, enum: [DRAFT] }
        method: { $ref: '#/components/schemas/PayoutMethod' }
        totalAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        itemCount: { type: integer, minimum: 1 }

    PayoutBatchCreateEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PayoutBatchCreateResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    PayoutBatchItemResponse:
      type: object
      required: [payoutBatchItemId, coachSettlementId, coachProfileId, amount, status]
      properties:
        payoutBatchItemId: { type: string, format: uuid }
        coachSettlementId: { type: string, format: uuid }
        coachProfileId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        status: { $ref: '#/components/schemas/PayoutBatchItemStatus' }
        paidAt: { type: [string, 'null'], format: date-time }
        referenceNo: { type: [string, 'null'], maxLength: 100 }
        failureReason: { type: [string, 'null'] }

    PayoutBatchResponse:
      type: object
      required: [payoutBatchId, batchNo, status, payoutDate, method, currency, totalAmount, itemCount, items]
      properties:
        payoutBatchId: { type: string, format: uuid }
        batchNo: { type: string }
        status: { $ref: '#/components/schemas/PayoutBatchStatus' }
        payoutDate: { type: string, format: date }
        method: { $ref: '#/components/schemas/PayoutMethod' }
        currency: { type: string, enum: [TWD] }
        totalAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        itemCount: { type: integer, minimum: 0 }
        approvedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/PayoutBatchItemResponse' } }

    PayoutBatchEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PayoutBatchResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    PayoutExecutionRequest:
      type: object
      additionalProperties: false
      required: [paidAt, reason]
      properties:
        paidAt: { type: string, format: date-time }
        referenceNo: { type: [string, 'null'], maxLength: 100 }
        reason: { type: string, minLength: 1, maxLength: 5000 }

    PayoutExecutionResponse:
      type: object
      required: [payoutBatchId, status, totalAmount, itemCount, completedAt]
      properties:
        payoutBatchId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED] }
        totalAmount: { $ref: '#/components/schemas/SettlementMoneyAmount' }
        itemCount: { type: integer, minimum: 1 }
        completedAt: { type: string, format: date-time }

    PayoutExecutionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PayoutExecutionResponse' }
        meta: { $ref: '#/components/schemas/Meta' }
'''

              if '\ncomponents:\n' not in openapi_text:
                  raise SystemExit('OpenAPI components marker not found')
              openapi_text = openapi_text.replace('\ncomponents:\n', path_snippet + '\ncomponents:\n', 1)
              if '  schemas:\n' not in openapi_text:
                  raise SystemExit('OpenAPI schemas marker not found')
              openapi_text = openapi_text.replace('  schemas:\n', '  schemas:\n' + schema_snippet, 1)
              openapi.write_text(openapi_text)
          PY
      - name: Generate TypeScript API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
      - name: Commit synchronized contract if changed
        run: |
          git add backend/src/main/java/com/pickleball/booking/settlement/infrastructure/SettlementStore.java \
                  backend/src/main/java/com/pickleball/booking/settlement/application/SettlementApplicationService.java \
                  backend/src/main/java/com/pickleball/booking/settlement/api/SettlementController.java \
                  backend/src/main/resources/openapi/openapi.yaml \
                  frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "Slice 7 contract already synchronized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(slice7): sync settlement OpenAPI client"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
