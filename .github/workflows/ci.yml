name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: bash ./mvnw test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify generated API client
        working-directory: frontend
        run: npm run api:check
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend Playwright E2E
        working-directory: frontend
        run: npm run e2e

  migration:
    name: Clean and forward PostgreSQL migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Flyway migrations using PostgreSQL Testcontainers
        working-directory: backend
        run: bash ./mvnw -Dtest=PostgresMigrationIT,Slice3MigrationIT,Slice4MigrationIT,Slice5MigrationIT,Slice6MigrationIT,Slice7MigrationIT,SettlementApplicationServiceIT,PayoutApplicationServiceIT test

  devops:
    name: Container and optional GCP reference validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --file backend/Dockerfile backend
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate optional GCP staging foundation
        working-directory: infra/terraform/bootstrap/staging-foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate optional GCP staging runtime
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate optional Firebase Hosting configuration
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"

  slice7-contract-sync:
    name: Slice 7 contract sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-7-settlement-payout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch Slice 7 OpenAPI contract
        run: python3 .github/scripts/slice7_openapi_sync.py
      - name: Generate and verify API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
          npm run api:check
      - name: Commit synchronized contract and remove scaffolding
        run: |
          git show 96422b570b0987accec3af35e11e6a06b32138ae:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/scripts/slice7_openapi_sync.py
          git add .github/workflows/ci.yml .github/scripts/slice7_openapi_sync.py \
            backend/src/main/resources/openapi/openapi.yaml \
            frontend/packages/api-client/src/generated
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(slice7): sync OpenAPI generated client"
          git push origin HEAD:feat/slice-7-settlement-payout

  zero-cost-production-like:
    name: Zero-cost production-like smoke
    needs: [backend, frontend, migration, devops]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend bundles
        working-directory: frontend
        env:
          VITE_LIFF_ID: zero-cost-prototype-liff
          VITE_API_BASE_URL: http://127.0.0.1:18080/api/v1
        run: |
          npm ci
          npm run api:check
          npm run build
          test -f apps/liff/dist/index.html
          test -f apps/admin/dist/index.html
      - name: Run ephemeral PostgreSQL + migration + API smoke
        run: bash scripts/zero-cost-production-like.sh
      - name: Upload zero-cost release candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-release-${{ github.sha }}
          path: zero-cost-release-metadata.json
          if-no-files-found: error
