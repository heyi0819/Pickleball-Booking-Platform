name: Slice 5 S5.5 UI Runner

on:
  push:
    branches:
      - feat/slice-5-course-operations-ui
    paths:
      - .github/workflows/slice5-s55-ui-runner.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-5-course-operations-ui
          fetch-depth: 0

      - name: Apply prepared UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/slice5-s55-ui-builder.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 's5.5-ui-builder', 'exec'))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
          npm run api:check

      - name: Commit UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/slice5-s55-ui-builder.yml .github/workflows/slice5-s55-ui-runner.yml
          git add frontend/packages/api-client/src/index.ts frontend/apps/liff/src frontend/apps/admin/src
          git diff --cached --check
          git commit -m "feat(slice5): add Course Operations LIFF and Admin UI"
          git push origin HEAD:feat/slice-5-course-operations-ui
