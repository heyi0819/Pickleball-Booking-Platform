name: S6 Finance Contract Sync

on:
  push:
    branches:
      - feat/slice-6-finance-api
    paths:
      - .github/workflows/s6-finance-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-6-finance-api
          fetch-depth: 0

      - name: Add Slice 6 finance contract to OpenAPI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/main/resources/openapi/openapi.yaml')
          text = path.read_text()
          marker = 'operationId: recordReceivablePayment'
          if marker in text:
              print('Finance contract already present; no OpenAPI insertion required.')
              raise SystemExit(0)

          paths = r'''

  /receivables/{receivableId}/payments:
    post:
      operationId: recordReceivablePayment
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: receivableId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinancePaymentRequest' } } }
      responses:
        '201': { description: Payment recorded, content: { application/json: { schema: { $ref: '#/components/schemas/FinancePaymentEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/{receivableId}/refunds:
    post:
      operationId: requestReceivableRefund
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      description: 'Canonical Slice 6 refund request: one Refund references one Payment.'
      parameters:
        - { name: receivableId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundRequest' } } }
      responses:
        '201': { description: Refund request pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundRequestEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /refunds/{refundId}/review:
    post:
      operationId: reviewRefund
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundReviewRequest' } } }
      responses:
        '200': { description: Refund approval decision, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundReviewEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /refunds/{refundId}/execution:
    post:
      operationId: executeRefund
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundExecutionRequest' } } }
      responses:
        '200': { description: Approved refund executed, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceRefundExecutionEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
'''

          schemas = r'''
    FinancePaymentMethod: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
    FinanceRefundReviewDecision: { type: string, enum: [APPROVE, REJECT] }
    FinanceMoneyAmount:
      type: string
      pattern: '^[0-9]{1,10}(?:\.[0-9]{1,2})?$'
      example: '1000.00'

    FinancePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method, paidAt, payerUserId]
      properties:
        amount: { $ref: '#/components/schemas/FinanceMoneyAmount' }
        method: { $ref: '#/components/schemas/FinancePaymentMethod' }
        paidAt: { type: string, format: date-time }
        payerUserId: { type: string, format: uuid }
        note: { type: [string, 'null'], maxLength: 5000 }

    FinancePaymentResponse:
      type: object
      required: [paymentId, receivableId, amount, method, paymentStatus, paidTotal, outstandingAmount]
      properties:
        paymentId: { type: string, format: uuid }
        receivableId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/FinanceMoneyAmount' }
        method: { $ref: '#/components/schemas/FinancePaymentMethod' }
        paymentStatus: { type: string, enum: [PARTIALLY_PAID, PAID] }
        paidTotal: { $ref: '#/components/schemas/FinanceMoneyAmount' }
        outstandingAmount: { $ref: '#/components/schemas/FinanceMoneyAmount' }

    FinancePaymentEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FinancePaymentResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    FinanceRefundRequest:
      type: object
      additionalProperties: false
      required: [paymentId, amount, reason]
      properties:
        paymentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/FinanceMoneyAmount' }
        reason: { type: string, minLength: 1, maxLength: 5000 }

    FinanceRefundRequestResponse:
      type: object
      required: [refundId, paymentId, status, amount, currency]
      properties:
        refundId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_APPROVAL] }
        amount: { $ref: '#/components/schemas/FinanceMoneyAmount' }
        currency: { type: string, enum: [TWD] }

    FinanceRefundRequestEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FinanceRefundRequestResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    FinanceRefundReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: { $ref: '#/components/schemas/FinanceRefundReviewDecision' }
        reason: { type: string, minLength: 1, maxLength: 5000 }

    FinanceRefundReviewResponse:
      type: object
      required: [refundId, status]
      properties:
        refundId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, REJECTED] }
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }

    FinanceRefundReviewEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FinanceRefundReviewResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

    FinanceRefundExecutionRequest:
      type: object
      additionalProperties: false
      required: [method, refundedAt]
      properties:
        method: { $ref: '#/components/schemas/FinancePaymentMethod' }
        refundedAt: { type: string, format: date-time }
        reference: { type: [string, 'null'], maxLength: 100 }

    FinanceRefundExecutionResponse:
      type: object
      required: [refundId, status, processedBy, refundedAt]
      properties:
        refundId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED] }
        processedBy: { type: string, format: uuid }
        refundedAt: { type: string, format: date-time }

    FinanceRefundExecutionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/FinanceRefundExecutionResponse' }
        meta: { $ref: '#/components/schemas/Meta' }

'''

          component_anchor = '\ncomponents:\n'
          schema_anchor = '  schemas:\n\n    CourseOfferingStatus:'
          if text.count(component_anchor) != 1 or text.count(schema_anchor) != 1:
              raise SystemExit('OpenAPI insertion anchor changed; refusing to rewrite contract.')

          text = text.replace(
              'description: P0 API contract through Slice 5 Course Operations.',
              'description: P0 API contract through Slice 6 Finance.')
          text = text.replace(component_anchor, paths + component_anchor, 1)
          text = text.replace(schema_anchor, '  schemas:\n\n' + schemas + '    CourseOfferingStatus:', 1)
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate TypeScript API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate

      - name: Commit synchronized contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/main/resources/openapi/openapi.yaml frontend/src/api/generated
          if git diff --cached --quiet; then
            echo 'No contract changes to commit.'
            exit 0
          fi
          git commit -m 'feat(slice6): publish finance OpenAPI client contract'
          git push origin HEAD:feat/slice-6-finance-api
