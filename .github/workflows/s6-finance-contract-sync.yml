name: S6 Finance Contract Sync

on:
  push:
    branches:
      - feat/slice-6-finance-api
    paths:
      - .github/workflows/s6-finance-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-6-finance-api
          fetch-depth: 0

      - name: Add Slice 6 finance contract to OpenAPI
        run: python scripts/s6_finance_contract_sync.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate TypeScript API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate

      - name: Add Slice 6 finance handwritten adapter
        run: python scripts/s6_finance_adapter_sync.py

      - name: Commit synchronized contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated frontend/packages/api-client/src/index.ts
          if git diff --cached --quiet; then
            echo 'No contract changes to commit.'
            exit 0
          fi
          git commit -m 'feat(slice6): expose finance client adapter'
          git push origin HEAD:feat/slice-6-finance-api
