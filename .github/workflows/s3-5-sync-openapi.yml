name: S3.5 OpenAPI Client Sync

on:
  push:
    branches:
      - codex/slice-3-s3-5

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/slice-3-s3-5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Write Slice 3 OpenAPI contract
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ""
          Path("backend/src/main/resources/openapi/openapi.yaml").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate TypeScript API client
        working-directory: frontend
        run: npm run api:generate
      - name: Commit synchronized contract and generated client
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "OpenAPI client already synchronized."
            exit 0
          fi
          git commit -m "chore(slice3): sync OpenAPI client"
          git push origin HEAD:codex/slice-3-s3-5
