name: Slice 5 Query Security Patch

on:
  push:
    branches:
      - feat/slice-5-course-operations-api
    paths:
      - .github/workflows/slice5-query-security-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(slice5): add query security patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-5-course-operations-api
          fetch-depth: 0

      - name: Apply privileged Course query security patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          query_path = Path('backend/src/main/java/com/pickleball/booking/course/application/CourseOperationsQueryService.java')
          text = query_path.read_text()
          text = replace_once(
              text,
              '''        CourseFilter normalized = normalize(filter);\n        Scope scope = scope(actor);\n        var params = new MapSqlParameterSource()''',
              '''        CourseFilter normalized = normalize(filter);\n        Scope scope = scope(actor);\n        authorizePrivilegedFilters(scope, normalized);\n        var params = new MapSqlParameterSource()''',
              'list authorization hook')
          text = replace_once(
              text,
              '''    private String buildCourseWhere(Scope scope, CourseFilter filter, MapSqlParameterSource params) {\n        List<String> visibility = new ArrayList<>();''',
              '''    private void authorizePrivilegedFilters(Scope scope, CourseFilter filter) {\n        boolean privilegedFilterRequested = filter.organizationId() != null || filter.studentUserId() != null;\n        if (!privilegedFilterRequested || scope.platformAdmin()) {\n            return;\n        }\n        if (scope.committeeOrganizations().isEmpty()) {\n            throw new BusinessException(\"AUTH_FORBIDDEN\",\n                    \"organizationId and studentUserId filters require Committee or Platform Admin privileges\");\n        }\n        if (filter.organizationId() != null\n                && !scope.committeeOrganizations().contains(filter.organizationId())) {\n            throw new BusinessException(\"ORG_SCOPE_DENIED\",\n                    \"Requested organization is outside the Committee authorization scope\");\n        }\n    }\n\n    private String buildCourseWhere(Scope scope, CourseFilter filter, MapSqlParameterSource params) {\n        boolean privilegedFilter = filter.organizationId() != null || filter.studentUserId() != null;\n        List<String> visibility = new ArrayList<>();''',
              'privileged filter guard')
          text = replace_once(
              text,
              '''            if (!scope.coachOrganizations().isEmpty()) {''',
              '''            if (!privilegedFilter && !scope.coachOrganizations().isEmpty()) {''',
              'coach visibility restriction')
          text = replace_once(
              text,
              '''            if (!scope.studentOrganizations().isEmpty()) {''',
              '''            if (!privilegedFilter && !scope.studentOrganizations().isEmpty()) {''',
              'student visibility restriction')
          query_path.write_text(text)

          test_path = Path('backend/src/test/java/com/pickleball/booking/course/api/Slice5HttpEndToEndIT.java')
          text = test_path.read_text()
          text = replace_once(
              text,
              '''        assertThat(committeeFiltered.get(\"total\").asLong()).isEqualTo(1);\n\n        JsonNode course = data(request(''',
              '''        assertThat(committeeFiltered.get(\"total\").asLong()).isEqualTo(1);\n\n        JsonNode committeeOrganizationFiltered = data(request(\n                \"GET\", \"/api/v1/courses?organizationId=\" + fixture.organizationId(),\n                committeeToken, null, null, 200));\n        assertThat(committeeOrganizationFiltered.get(\"total\").asLong()).isEqualTo(1);\n\n        JsonNode studentUserFilterForbidden = error(request(\n                \"GET\", \"/api/v1/courses?studentUserId=\" + fixture.studentId(),\n                studentToken, null, null, 403));\n        assertThat(studentUserFilterForbidden.get(\"code\").asText()).isEqualTo(\"AUTH_FORBIDDEN\");\n\n        JsonNode studentOrganizationFilterForbidden = error(request(\n                \"GET\", \"/api/v1/courses?organizationId=\" + fixture.organizationId(),\n                studentToken, null, null, 403));\n        assertThat(studentOrganizationFilterForbidden.get(\"code\").asText()).isEqualTo(\"AUTH_FORBIDDEN\");\n\n        JsonNode committeeOtherOrganizationDenied = error(request(\n                \"GET\", \"/api/v1/courses?organizationId=\" + UUID.randomUUID(),\n                committeeToken, null, null, 403));\n        assertThat(committeeOtherOrganizationDenied.get(\"code\").asText()).isEqualTo(\"ORG_SCOPE_DENIED\");\n\n        JsonNode course = data(request(''',
              'HTTP query security regression')
          test_path.write_text(text)

          openapi_path = Path('backend/src/main/resources/openapi/openapi.yaml')
          text = openapi_path.read_text()
          text = replace_once(
              text,
              '''        - { name: organizationId, in: query, required: false, schema: { type: string, format: uuid } }\n        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED] } }''',
              '''        - { name: organizationId, in: query, required: false, description: 'COMMITTEE may filter only within own organization scope; PLATFORM_ADMIN may filter globally. STUDENT/COACH are forbidden from using this filter.', schema: { type: string, format: uuid } }\n        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED] } }''',
              'OpenAPI organizationId description')
          text = replace_once(
              text,
              '''        - { name: studentUserId, in: query, required: false, schema: { type: string, format: uuid } }\n        - { name: courseType, in: query, required: false, schema: { type: string, enum: [PRIVATE, GROUP] } }''',
              '''        - { name: studentUserId, in: query, required: false, description: 'COMMITTEE/PLATFORM_ADMIN only. Non-admin Committee queries remain restricted to the actor organization scope.', schema: { type: string, format: uuid } }\n        - { name: courseType, in: query, required: false, schema: { type: string, enum: [PRIVATE, GROUP] } }''',
              'OpenAPI studentUserId description')
          openapi_path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate TypeScript API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate

      - name: Commit security hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/pickleball/booking/course/application/CourseOperationsQueryService.java \
                  backend/src/test/java/com/pickleball/booking/course/api/Slice5HttpEndToEndIT.java \
                  backend/src/main/resources/openapi/openapi.yaml \
                  frontend/packages/api-client/src/generated
          git diff --cached --check
          git commit -m "fix(slice5): enforce privileged course query filters"
          git push origin HEAD:feat/slice-5-course-operations-api
