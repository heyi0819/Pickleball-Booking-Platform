name: Slice 5 S5.5 Contract Runner

on:
  push:
    branches:
      - feat/slice-5-course-operations-ui
    paths:
      - .github/workflows/slice5-s55-contract-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-5-course-operations-ui
          fetch-depth: 0

      - name: Apply prepared contract patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/slice5-s55-contract-backfill.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 's5.5-contract-backfill', 'exec'))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate TypeScript API client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate

      - name: Commit contract backfill
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/slice5-s55-contract-backfill.yml .github/workflows/slice5-s55-contract-runner.yml
          git add backend/src/main/java/com/pickleball/booking/course/application/CourseOperationsQueryService.java \
                  backend/src/main/java/com/pickleball/booking/course/api/CourseOperationsController.java \
                  backend/src/main/resources/openapi/openapi.yaml \
                  backend/src/test/java/com/pickleball/booking/course/api/Slice5HttpEndToEndIT.java \
                  frontend/packages/api-client/src/generated
          git diff --cached --check
          git commit -m "feat(slice5): expose committee operation review queues"
          git push origin HEAD:feat/slice-5-course-operations-ui
