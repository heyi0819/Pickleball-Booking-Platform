name: Slice 4 OpenAPI Sync

on:
  push:
    branches:
      - feat/slice-4-open-enrollment-api
    paths:
      - .github/workflows/slice4-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Fix one-time helper replacement semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("frontend/scripts/apply-slice4-openapi.mjs")
          text = path.read_text(encoding="utf-8")
          old_components = 'text = text.replace("\\ncomponents:\\n", `${paths}\\ncomponents:\\n`);'
          new_components = 'text = text.replace("\\ncomponents:\\n", () => `${paths}\\ncomponents:\\n`);'
          old_schemas = 'text = text.replace("  schemas:\\n", `  schemas:\\n${schemas}`);'
          new_schemas = 'text = text.replace("  schemas:\\n", () => `  schemas:\\n${schemas}`);'
          if old_components not in text or old_schemas not in text:
              raise SystemExit("Expected helper replacement expressions were not found")
          text = text.replace(old_components, new_components).replace(old_schemas, new_schemas)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply Slice 4 OpenAPI contract
        run: node frontend/scripts/apply-slice4-openapi.mjs
      - name: Inspect generated OpenAPI boundary
        shell: bash
        run: |
          echo "== marker lines =="
          grep -nE 'CourseOfferingPricingPreviewRequest|CourseOfferingPricingConfirmationRequest|CourseOfferingConfirmationEnvelope|ProfileUpdateRequest|pattern:' backend/src/main/resources/openapi/openapi.yaml || true
          echo "== lines 720-765 =="
          nl -ba backend/src/main/resources/openapi/openapi.yaml | sed -n '720,765p'
          echo "== line count =="
          wc -l backend/src/main/resources/openapi/openapi.yaml
      - name: Generate TypeScript API client
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract and client
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(slice4): sync Open Enrollment OpenAPI client"
          git push origin HEAD:feat/slice-4-open-enrollment-api
