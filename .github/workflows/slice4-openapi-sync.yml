name: Slice 4 OpenAPI Sync

on:
  push:
    branches:
      - feat/slice-4-open-enrollment-api
    paths:
      - .github/workflows/slice4-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply Slice 4 OpenAPI contract
        run: node frontend/scripts/apply-slice4-openapi.mjs
      - name: Normalize regex schemas for YAML parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/src/main/resources/openapi/openapi.yaml")
          text = path.read_text(encoding="utf-8")
          currency = "        currency: { type: string, pattern: '^[A-Za-z]{3}$' }"
          fingerprint = "        pricingFingerprint: { type: string, pattern: '^[0-9a-fA-F]{64}$' }"
          if currency not in text or fingerprint not in text:
              raise SystemExit("Expected Slice 4 regex schemas were not found")
          text = text.replace(
              currency,
              '        currency:\n          type: string\n          pattern: "^[A-Za-z]{3}$"')
          text = text.replace(
              fingerprint,
              '        pricingFingerprint:\n          type: string\n          pattern: "^[0-9a-fA-F]{64}$"')
          path.write_text(text, encoding="utf-8")
          PY
      - name: Generate TypeScript API client
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract and client
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(slice4): sync Open Enrollment OpenAPI client"
          git push origin HEAD:feat/slice-4-open-enrollment-api
