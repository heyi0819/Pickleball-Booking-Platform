name: Slice 4 OpenAPI Sync

on:
  push:
    branches:
      - feat/slice-4-open-enrollment-api
    paths:
      - .github/workflows/slice4-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply Slice 4 OpenAPI contract
        run: node frontend/scripts/apply-slice4-openapi.mjs
      - name: Normalize regex schemas for YAML parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/src/main/resources/openapi/openapi.yaml")
          text = path.read_text(encoding="utf-8")

          currency_pattern = re.compile(
              r"(?m)^([ \t]*)currency:\s*\{\s*type:\s*string,\s*pattern:\s*'\^\[A-Za-z\]\{3\}\$'\s*\}\s*$"
          )
          fingerprint_pattern = re.compile(
              r"(?m)^([ \t]*)pricingFingerprint:\s*\{\s*type:\s*string,\s*pattern:\s*'\^\[0-9a-fA-F\]\{64\}\$'\s*\}\s*$"
          )

          def currency_replacement(match):
              indent = match.group(1)
              return (
                  f'{indent}currency:\n'
                  f'{indent}  type: string\n'
                  f'{indent}  pattern: "^[A-Za-z]{{3}}$"'
              )

          def fingerprint_replacement(match):
              indent = match.group(1)
              return (
                  f'{indent}pricingFingerprint:\n'
                  f'{indent}  type: string\n'
                  f'{indent}  pattern: "^[0-9a-fA-F]{{64}}$"'
              )

          text, currency_count = currency_pattern.subn(currency_replacement, text)
          text, fingerprint_count = fingerprint_pattern.subn(fingerprint_replacement, text)
          print(f"Normalized currency schemas: {currency_count}; fingerprint schemas: {fingerprint_count}")
          if currency_count < 2 or fingerprint_count != 1:
              raise SystemExit("Slice 4 regex schema normalization count was unexpected")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Generate TypeScript API client
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract and client
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(slice4): sync Open Enrollment OpenAPI client"
          git push origin HEAD:feat/slice-4-open-enrollment-api
