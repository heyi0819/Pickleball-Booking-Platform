name: Slice 5 OpenAPI Sync

on:
  push:
    branches:
      - feat/slice-5-course-operations-api
    paths:
      - frontend/scripts/apply-slice5-openapi.mjs
      - .github/workflows/slice5-openapi-sync.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slice-5-course-operations-api
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply Slice 5 OpenAPI contract
        working-directory: frontend
        run: node scripts/apply-slice5-openapi.mjs
      - name: Generate TypeScript client
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract and client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/openapi/openapi.yaml frontend/packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(slice5): sync Course Operations OpenAPI client"
          git push origin HEAD:feat/slice-5-course-operations-api
