name: S3.5 regenerate OpenAPI client

on:
  push:
    branches:
      - codex/slice-3-s3-5

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/slice-3-s3-5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate typed client and self-clean
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run api:generate
          rm ../.github/workflows/s3-5-regenerate-openapi.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/api-client/src/generated ../.github/workflows/s3-5-regenerate-openapi.yml
          git commit -m "chore(slice3): regenerate OpenAPI client"
          git push origin HEAD:codex/slice-3-s3-5
