openapi: 3.1.0
info:
  title: Pickleball Booking Platform API
  version: v1
  description: Slice 1 identity API contract.
servers:
  - url: /api/v1
paths:
  /auth/line/login:
    post:
      operationId: loginWithLine
      tags: [Authentication]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LineLoginRequest' } } }
      responses:
        '200': { description: Platform access token issued, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponseEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me:
    get:
      operationId: getCurrentUser
      tags: [Current user]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponseEnvelope' } } } }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/profile:
    patch:
      operationId: updateCurrentUserProfile
      tags: [Current user]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdateRequest' } } }
      responses:
        '200': { description: Updated current user, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponseEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/roles:
    get:
      operationId: getCurrentUserRoles
      tags: [Current user]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active role assignments, content: { application/json: { schema: { $ref: '#/components/schemas/RolesResponseEnvelope' } } } }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /coach-applications:
    post:
      operationId: createCoachApplication
      tags: [Coach applications]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CoachApplicationRequest' } } } }
      responses: { '201': { description: Coach application, content: { application/json: { schema: { $ref: '#/components/schemas/CoachApplicationEnvelope' } } } } }
    get:
      operationId: listCoachApplicationsForReview
      tags: [Coach applications]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Coach applications, content: { application/json: { schema: { $ref: '#/components/schemas/CoachApplicationListEnvelope' } } } } }
  /coach-applications/mine:
    get:
      operationId: listMyCoachApplications
      tags: [Coach applications]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: My coach applications, content: { application/json: { schema: { $ref: '#/components/schemas/CoachApplicationListEnvelope' } } } } }
  /coach-applications/{id}/review:
    post:
      operationId: reviewCoachApplication
      tags: [Coach applications]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses: { '200': { description: Reviewed application, content: { application/json: { schema: { $ref: '#/components/schemas/CoachApplicationEnvelope' } } } } }
  /coach-availability-proposals:
    post:
      operationId: createAvailabilityProposal
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalRequest' } } } }
      responses: { '201': { description: Availability proposal, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalEnvelope' } } } } }
    get:
      operationId: listAvailabilityForReview
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Availability proposals, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalListEnvelope' } } } } }
  /coach-availability-proposals/mine:
    get:
      operationId: listMyAvailabilityProposals
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: My availability proposals, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalListEnvelope' } } } } }
  /coach-availability-proposals/available:
    get:
      operationId: listApprovedAvailability
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Approved future availability for the current student organization, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalListEnvelope' } } } } }
  /coach-availability-proposals/{id}/submission:
    post:
      operationId: submitAvailabilityProposal
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Submitted availability, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalEnvelope' } } } } }
  /coach-availability-proposals/{id}/review:
    post:
      operationId: reviewAvailabilityProposal
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses: { '200': { description: Reviewed availability, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalEnvelope' } } } } }
  /coach-availability-proposals/{id}/close:
    post:
      operationId: closeAvailabilityProposal
      tags: [Coach availability]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Closed availability, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityProposalEnvelope' } } } } }
  /lesson-requests:
    post:
      operationId: createLessonRequest
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestCreateRequest' } } } }
      responses: { '201': { description: Lesson request, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestEnvelope' } } } } }
    get:
      operationId: listLessonRequestsForReview
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Lesson requests, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestListEnvelope' } } } } }
  /lesson-requests/mine:
    get:
      operationId: listMyLessonRequests
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: My lesson requests, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestListEnvelope' } } } } }
  /lesson-requests/{id}:
    get:
      operationId: getLessonRequest
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Lesson request detail, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestDetailEnvelope' } } } } }
  /lesson-requests/{id}/submission:
    post:
      operationId: submitLessonRequest
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses: { '200': { description: Submitted lesson request, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestEnvelope' } } } } }
  /lesson-requests/{id}/selected-availability:
    patch:
      operationId: updateLessonRequestSelectedAvailability
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SelectedAvailabilityRequest' } } } }
      responses: { '200': { description: Updated draft availability selection, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestEnvelope' } } } } }
  /lesson-requests/{id}/review:
    post:
      operationId: reviewLessonRequest
      tags: [Lesson requests]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses: { '200': { description: Reviewed lesson request, content: { application/json: { schema: { $ref: '#/components/schemas/LessonRequestEnvelope' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    InvalidToken: { description: Invalid or missing token, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: Access forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ValidationFailed: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    LineLoginRequest:
      type: object
      required: [idToken]
      properties: { idToken: { type: string, minLength: 1, maxLength: 10000 } }
    ProfileUpdateRequest:
      type: object
      required: [displayName, locale]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        locale: { type: string, minLength: 1, maxLength: 10 }
    RoleCode: { type: string, enum: [STUDENT, COACH, COMMITTEE, PLATFORM_ADMIN] }
    RoleContext:
      type: object
      required: [roleCode]
      properties:
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        organizationId: { type: [string, 'null'], format: uuid }
        organizationCode: { type: [string, 'null'] }
        organizationName: { type: [string, 'null'] }
    LoginUser:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
    LoginData:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, example: 1800 }
        user: { $ref: '#/components/schemas/LoginUser' }
    Me:
      type: object
      required: [id, displayName, locale, profileComplete, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        locale: { type: string }
        profileComplete: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleContext' } }
    Meta:
      type: object
      required: [requestId]
      properties: { requestId: { type: string } }
    LoginResponseEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/LoginData' }, meta: { $ref: '#/components/schemas/Meta' } }
    MeResponseEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/Me' }, meta: { $ref: '#/components/schemas/Meta' } }
    RolesResponseEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/RoleContext' } }, meta: { $ref: '#/components/schemas/Meta' } }
    ErrorBody:
      type: object
      required: [code, message, fieldErrors, details, traceId]
      properties:
        code: { type: string, example: AUTH_INVALID_TOKEN }
        message: { type: string }
        fieldErrors: { type: array, items: {} }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties: { error: { $ref: '#/components/schemas/ErrorBody' } }
    ReviewRequest:
      type: object
      required: [decision, reviewNote]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        reviewNote: { type: string, minLength: 1, maxLength: 5000 }
    CoachApplicationRequest:
      type: object
      properties:
        applicationNote: { type: [string, 'null'], maxLength: 5000 }
        skillLevel: { type: [string, 'null'], maxLength: 30 }
        bio: { type: [string, 'null'], maxLength: 10000 }
    CoachApplication:
      type: object
      required: [id, coachProfileId, status, submittedAt]
      properties:
        id: { type: string, format: uuid }
        coachProfileId: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, APPROVED, REJECTED, WITHDRAWN] }
        applicationNote: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'] }
    AvailabilityProposalRequest:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        preferredVenueId: { type: [string, 'null'], format: uuid }
    AvailabilityProposal:
      type: object
      required: [id, coachProfileId, startAt, endAt, status]
      properties:
        id: { type: string, format: uuid }
        coachProfileId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        preferredVenueId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, MATCHED, CLOSED] }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'] }
    SessionPreference:
      type: object
      required: [sequenceNo, startAt, endAt]
      properties:
        sequenceNo: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        preferredVenueId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 500 }
    SelectedAvailabilityRequest:
      type: object
      properties:
        selectedAvailabilityProposalId: { type: [string, 'null'], format: uuid }
    LessonRequestCreateRequest:
      type: object
      required: [lessonType, scheduleType, billingMode, participantCount, guestParticipantCount, requestedSessionCount, sessionPreferences]
      properties:
        lessonType: { type: string, enum: [PRIVATE, GROUP] }
        scheduleType: { type: string, enum: [SINGLE, RECURRING] }
        billingMode: { type: string, enum: [FULL_COURSE, PER_SESSION] }
        skillLevel: { type: [string, 'null'], maxLength: 30 }
        participantCount: { type: integer, minimum: 1 }
        guestParticipantCount: { type: integer, minimum: 0 }
        minimumParticipants: { type: [integer, 'null'] }
        maximumParticipants: { type: [integer, 'null'] }
        requestedSessionCount: { type: integer, minimum: 1 }
        preferredCoachProfileId: { type: [string, 'null'], format: uuid }
        selectedAvailabilityProposalId: { type: [string, 'null'], format: uuid }
        sessionPreferences: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SessionPreference' } }
        notes: { type: [string, 'null'], maxLength: 10000 }
    LessonRequest:
      type: object
      required: [id, requesterUserId, lessonType, scheduleType, billingMode, participantCount, guestParticipantCount, requestedSessionCount, status]
      properties:
        id: { type: string, format: uuid }
        requesterUserId: { type: string, format: uuid, readOnly: true }
        preferredCoachProfileId: { type: [string, 'null'], format: uuid }
        selectedAvailabilityProposalId: { type: [string, 'null'], format: uuid, readOnly: true }
        lessonType: { type: string }
        scheduleType: { type: string }
        billingMode: { type: string }
        skillLevel: { type: [string, 'null'] }
        participantCount: { type: integer }
        guestParticipantCount: { type: integer }
        minimumParticipants: { type: [integer, 'null'] }
        maximumParticipants: { type: [integer, 'null'] }
        requestedSessionCount: { type: integer }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, MATCHED, CANCELLED] }
        notes: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'] }
    LessonRequestDetail:
      type: object
      required: [lessonRequest, sessionPreferences]
      properties:
        lessonRequest: { $ref: '#/components/schemas/LessonRequest' }
        sessionPreferences: { type: array, items: { $ref: '#/components/schemas/SessionPreference' } }
    CoachApplicationEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/CoachApplication' }, meta: { $ref: '#/components/schemas/Meta' } }
    CoachApplicationListEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/CoachApplication' } }, meta: { $ref: '#/components/schemas/Meta' } }
    AvailabilityProposalEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/AvailabilityProposal' }, meta: { $ref: '#/components/schemas/Meta' } }
    AvailabilityProposalListEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AvailabilityProposal' } }, meta: { $ref: '#/components/schemas/Meta' } }
    LessonRequestEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/LessonRequest' }, meta: { $ref: '#/components/schemas/Meta' } }
    LessonRequestListEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/LessonRequest' } }, meta: { $ref: '#/components/schemas/Meta' } }
    LessonRequestDetailEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/LessonRequestDetail' }, meta: { $ref: '#/components/schemas/Meta' } }
