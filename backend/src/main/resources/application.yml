spring:
  application:
    name: pickleball-booking-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pickleball_booking}
    username: ${DATABASE_USERNAME:pickleball}
    password: ${DATABASE_PASSWORD:change-me-for-local-use}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

security:
  jwt:
    # Required at runtime; production injects this from its secret store.
    signing-secret: ${JWT_SIGNING_SECRET:}

line:
  login:
    channel-id: ${LINE_LOGIN_CHANNEL_ID:${LINE_CHANNEL_ID:}}
    channel-secret: ${LINE_LOGIN_CHANNEL_SECRET:}
    admin-redirect-uri: ${LINE_LOGIN_ADMIN_REDIRECT_URI:}
    token-url: ${LINE_TOKEN_URL:https://api.line.me/oauth2/v2.1/token}
    verify-url: ${LINE_VERIFY_URL:https://api.line.me/oauth2/v2.1/verify}
    timeout-millis: ${LINE_VERIFY_TIMEOUT_MILLIS:3000}
  messaging:
    channel-access-token: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:}
    push-url: ${LINE_MESSAGING_PUSH_URL:https://api.line.me/v2/bot/message/push}
    timeout-millis: ${LINE_MESSAGING_TIMEOUT_MILLIS:3000}

identity:
  default-organization-code: ${DEFAULT_ORGANIZATION_CODE:MVP-DEFAULT}
  default-organization-name: ${DEFAULT_ORGANIZATION_NAME:Pickleball MVP}

app:
  cors:
    # Empty by default: browser requests from every cross-origin site are denied.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  workers:
    enabled: ${WORKERS_ENABLED:false}
    outbox-delay-ms: ${OUTBOX_WORKER_DELAY_MS:5000}
    notification-delay-ms: ${NOTIFICATION_WORKER_DELAY_MS:5000}
    coach-reminder-cron: ${COACH_REMINDER_CRON:0 0 18 * * *}
    coach-reminder-zone: ${COACH_REMINDER_ZONE:Asia/Taipei}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
