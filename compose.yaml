services:
  postgres:
    image: postgres:18
    container_name: pickleball-booking-postgres
    environment:
      POSTGRES_DB: pickleball_booking
      POSTGRES_USER: pickleball
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-for-local-use}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
